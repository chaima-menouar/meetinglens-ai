# Copy this structure into Streamlit Community Cloud > App settings > Secrets.
# Never commit real tokens/keys to the repository.

# Optional automatic speaker diarization
HF_TOKEN = "hf_your_read_token_here"

# Optional durable Memory Vault (Supabase)
# Leave these unset to use the built-in runtime JSON fallback.
SUPABASE_URL = "https://your-project.supabase.co"
SUPABASE_SERVICE_KEY = "your_server_side_service_role_key"
SUPABASE_TABLE = "meetinglens_meetings"

# Optional logical isolation boundary for this deployment/workspace.
# Use a stable slug such as "personal", "team-alpha", or "company-demo".
MEETINGLENS_WORKSPACE_ID = "default"
