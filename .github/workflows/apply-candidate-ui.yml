name: apply-candidate-review-ui

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-candidate-ui.yml'
      - 'scripts/apply_candidate_review_ui.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply candidate review patch
        run: python scripts/apply_candidate_review_ui.py

      - name: Commit patched app
        run: |
          git config user.name "meetinglens-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "UI patch is already applied."
          else
            git commit -m "feat: surface AI candidate review in decision workspace"
            git push origin HEAD:main
          fi
