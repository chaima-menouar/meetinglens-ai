name: train-ami-baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'training/ami_dataset.py'
      - 'training/download_ami.py'
      - 'training/train_baseline.py'
      - 'training/train_event_detectors.py'
      - 'training/train_production_detectors.py'
      - 'training/train_candidate_rankers.py'
      - 'training/run_ami_training.py'
      - 'requirements-training.txt'
      - '.github/workflows/train-ami.yml'

permissions:
  contents: write

concurrency:
  group: meetinglens-ami-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install training dependencies
        run: pip install -r requirements-training.txt

      - name: Download AMI manual annotations
        run: python -m training.download_ami

      - name: Build dataset and train models
        run: python -m training.run_ami_training --skip-download

      - name: Publish metrics to job summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lines = ['# MeetingLens AMI training', '']
          baseline_path = Path('artifacts/meeting_event_baseline/metrics.json')
          if baseline_path.exists():
              m = json.loads(baseline_path.read_text())
              report = m['classification_report']
              lines += [
                  '## V1 multiclass baseline',
                  f"- Rows: {m['rows_total']}",
                  f"- Macro F1: {report['macro avg']['f1-score']:.4f}",
                  f"- Weighted F1: {report['weighted avg']['f1-score']:.4f}",
                  '',
              ]

          v2_path = Path('artifacts/meeting_event_detectors_v2/metrics.json')
          if v2_path.exists():
              m = json.loads(v2_path.read_text())
              lines += [
                  '## V2 annotation-assisted detectors',
                  f"- Macro event F1: {m['macro_event_f1']:.4f}",
                  f"- Macro event AP: {m['macro_event_average_precision']:.4f}",
              ]
              for event, values in m['events'].items():
                  lines.append(
                      f"- {event}: F1={values['f1']:.4f}, precision={values['precision']:.4f}, "
                      f"recall={values['recall']:.4f}, AP={values['average_precision']:.4f}, "
                      f"threshold={values['threshold']:.4f}"
                  )
              lines += ['', '> V2 uses AMI dialogue-act annotations and is an offline research upper bound, not a production score.', '']

          prod_path = Path('artifacts/meeting_event_detectors_production/metrics.json')
          if prod_path.exists():
              m = json.loads(prod_path.read_text())
              lines += [
                  '## Production-safe gold transcript classifiers',
                  f"- Supervision: {m.get('supervision', 'unknown')}",
                  f"- Macro event F1: {m['macro_event_f1']:.4f}",
                  f"- Macro event AP: {m['macro_event_average_precision']:.4f}",
              ]
              for event, values in m['events'].items():
                  lines.append(
                      f"- {event}: F1={values['f1']:.4f}, precision={values['precision']:.4f}, "
                      f"recall={values['recall']:.4f}, AP={values['average_precision']:.4f}, "
                      f"threshold={values['threshold']:.4f}"
                  )
              lines += ['', '> Inputs are transcript text only; targets are gold AMI summary links.', '']

          rank_path = Path('artifacts/meeting_candidate_rankers/metrics.json')
          if rank_path.exists():
              m = json.loads(rank_path.read_text())
              lines += ['## Meeting candidate rankers', '']
              for event, values in m['events'].items():
                  r = values['test_ranking']
                  lines += [
                      f"### {event}",
                      f"- Test AP: {values['test_average_precision']:.4f}",
                      f"- MRR: {r['mrr']:.4f}",
                      f"- Median first gold rank: {r['median_first_positive_rank']:.1f}",
                      f"- Hit@5: {r['hit@5']:.4f}",
                      f"- Hit@10: {r['hit@10']:.4f}",
                      f"- Hit@20: {r['hit@20']:.4f}",
                      '',
                  ]
              lines += ['> Candidate ranking is the production-oriented formulation: rank transcript segments inside each meeting instead of classifying every utterance globally.', '']

          Path('summary.md').write_text('\n'.join(lines) + '\n')
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Quality gate candidate rankers
        id: ranker_gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('artifacts/meeting_candidate_rankers/metrics.json')
          if not path.exists():
              raise SystemExit('Candidate-ranker metrics are missing')
          metrics = json.loads(path.read_text())
          decision = metrics['events']['decision']['validation_ranking']
          action = metrics['events']['action']['validation_ranking']

          checks = {
              'decision_mrr': decision['mrr'] >= 0.30,
              'decision_hit5': decision['hit@5'] >= 0.45,
              'decision_hit10': decision['hit@10'] >= 0.65,
              'action_mrr': action['mrr'] >= 0.50,
              'action_hit5': action['hit@5'] >= 0.70,
          }
          promote = all(checks.values())
          print('promotion checks:', checks)
          print('promote:', promote)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"promote={'true' if promote else 'false'}\n")
          PY

      - name: Promote reviewed candidate rankers
        if: steps.ranker_gate.outputs.promote == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "meetinglens-ml-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            artifacts/meeting_candidate_rankers/decision_ranker.joblib \
            artifacts/meeting_candidate_rankers/action_ranker.joblib \
            artifacts/meeting_candidate_rankers/metrics.json
          if git diff --cached --quiet; then
            echo "Promoted rankers are already current."
          else
            git commit -m "ml: promote reviewed meeting candidate rankers"
            git push origin HEAD:main
          fi

      - name: Upload trained models and metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meetinglens-ami-models
          path: |
            artifacts/meeting_event_baseline/
            artifacts/meeting_event_detectors_v2/
            artifacts/meeting_event_detectors_production/
            artifacts/meeting_candidate_rankers/
            data/processed/ami_events.csv
          retention-days: 14
