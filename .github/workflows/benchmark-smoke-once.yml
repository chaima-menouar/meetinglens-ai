name: benchmark-smoke-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/benchmark-smoke-once.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install app dependencies
        run: pip install -r requirements.txt

      - name: Download official AMI meeting audio
        run: |
          curl --fail --location --retry 3 \
            -o ami_full.wav \
            https://groups.inf.ed.ac.uk/ami/AMICorpusMirror/amicorpus/ES2002a/audio/ES2002a.Mix-Headset.wav

      - name: Trim first 60 seconds
        run: |
          python - <<'PY'
          import wave
          with wave.open('ami_full.wav', 'rb') as src:
              params = src.getparams()
              frames = src.readframes(min(src.getnframes(), int(src.getframerate() * 60)))
          with wave.open('ami_sample.wav', 'wb') as dst:
              dst.setparams(params)
              dst.writeframes(frames)
          PY

      - name: Benchmark MeetingLens tiny.en
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python benchmarks/benchmark_audio_pipeline.py \
            ami_sample.wav --model tiny.en --output benchmark_result.json

      - name: Publish summary
        run: |
          echo '## One-off AMI transcription smoke benchmark' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark_result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: meetinglens-ami-smoke
          path: benchmark_result.json
          retention-days: 7
