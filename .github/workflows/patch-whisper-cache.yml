name: patch-whisper-cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-whisper-cache.yml'
      - 'scripts/patch_whisper_cache.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Whisper cache patch
        run: python scripts/patch_whisper_cache.py
      - name: Commit optimized pipeline
        run: |
          git config user.name "meetinglens-performance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meetinglens_pipeline.py
          if git diff --cached --quiet; then
            echo "Cache already applied."
          else
            git commit -m "perf: cache Whisper models across analyses"
            git push origin HEAD:main
          fi
