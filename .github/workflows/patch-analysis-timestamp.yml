name: patch-analysis-timestamp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-analysis-timestamp.yml'
      - 'scripts/patch_analysis_timestamp.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply timestamp patch
        run: python scripts/patch_analysis_timestamp.py
      - name: Commit timestamp integration
        run: |
          git config user.name "meetinglens-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meetinglens_pipeline.py
          if git diff --cached --quiet; then
            echo "Timestamp already applied."
          else
            git commit -m "feat: timestamp analyzed meetings for chronological memory"
            git push origin HEAD:main
          fi
