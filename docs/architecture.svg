<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc"><title id="title">MeetingLens AI architecture</title><desc id="desc">Meeting audio is transcribed with faster-whisper and optionally diarized with pyannote, then enriched with sentiment, rules, candidate rankers, action and risk extraction, reviewed by humans, persisted to memory, and surfaced through Streamlit intelligence views.</desc><defs><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.t{font:600 17px Arial,sans-serif;fill:#0f172a}.s{font:13px Arial,sans-serif;fill:#475569}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect class="b" x="25" y="185" width="150" height="85"/><text class="t" x="100" y="218" text-anchor="middle">Meeting Audio</text><text class="s" x="100" y="244" text-anchor="middle">MP3 / WAV / M4A</text><rect class="b" x="225" y="75" width="180" height="85"/><text class="t" x="315" y="108" text-anchor="middle">faster-whisper</text><text class="s" x="315" y="134" text-anchor="middle">timestamps + VAD</text><rect class="b" x="225" y="285" width="180" height="85"/><text class="t" x="315" y="318" text-anchor="middle">pyannote</text><text class="s" x="315" y="344" text-anchor="middle">optional diarization</text><rect class="b" x="465" y="185" width="180" height="85"/><text class="t" x="555" y="218" text-anchor="middle">Aligned Transcript</text><text class="s" x="555" y="244" text-anchor="middle">speaker + time evidence</text><rect class="b" x="705" y="70" width="190" height="85"/><text class="t" x="800" y="103" text-anchor="middle">Meeting Intelligence</text><text class="s" x="800" y="129" text-anchor="middle">sentiment + rules + risks</text><rect class="b" x="705" y="185" width="190" height="85"/><text class="t" x="800" y="218" text-anchor="middle">Candidate Rankers</text><text class="s" x="800" y="244" text-anchor="middle">Decision / Action</text><rect class="b" x="705" y="300" width="190" height="85"/><text class="t" x="800" y="333" text-anchor="middle">Human Review</text><text class="s" x="800" y="359" text-anchor="middle">confirm / reject / correct</text><rect class="b" x="955" y="115" width="175" height="85"/><text class="t" x="1042" y="148" text-anchor="middle">Meeting JSON</text><text class="s" x="1042" y="174" text-anchor="middle">evidence bundle</text><rect class="b" x="955" y="260" width="175" height="85"/><text class="t" x="1042" y="293" text-anchor="middle">Memory Vault</text><text class="s" x="1042" y="319" text-anchor="middle">JSON / Supabase</text><rect class="b" x="1160" y="185" width="95" height="85"/><text class="t" x="1207" y="218" text-anchor="middle">UI</text><text class="s" x="1207" y="244" text-anchor="middle">Streamlit</text><path class="a" d="M175 215 C195 215 195 117 225 117"/><path class="a" d="M175 240 C195 240 195 327 225 327"/><path class="a" d="M405 117 C435 117 435 205 465 215"/><path class="a" d="M405 327 C435 327 435 250 465 240"/><path class="a" d="M645 210 C675 210 675 112 705 112"/><path class="a" d="M645 227 H705"/><path class="a" d="M895 112 C925 112 925 150 955 157"/><path class="a" d="M895 227 C925 227 925 175 955 170"/><path class="a" d="M895 342 C925 342 925 310 955 302"/><path class="a" d="M1042 200 V260"/><path class="a" d="M1130 157 C1145 157 1145 205 1160 215"/><path class="a" d="M1130 302 C1145 302 1145 250 1160 240"/></svg>